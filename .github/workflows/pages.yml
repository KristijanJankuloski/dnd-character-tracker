name: Privacy policy (GitHub Pages)

# Publishes only the privacy-policy/ folder, not the rest of the repo.
# One-time setup: Settings > Pages > Source: "GitHub Actions".
on:
  push:
    branches: [master]
    paths: ['privacy-policy/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: privacy-policy
      - id: deployment
        uses: actions/deploy-pages@v4
